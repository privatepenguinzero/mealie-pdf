name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mealie-pdf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Latest Mealie release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R mealie-recipes/mealie --json tagName -q .tagName)
          pr=$(gh pr view 8536 -R mealie-recipes/mealie --json headRefOid -q .headRefOid | cut -c1-7)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Upstream: $tag, PR #8536 at $pr"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && docker manifest inspect "$IMAGE:${{ steps.upstream.outputs.tag }}-pr${{ steps.upstream.outputs.pr }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built"
          fi

      - uses: astral-sh/setup-uv@v10
        if: steps.check.outputs.skip != 'true'

      - name: Mealie source with the document import
        if: steps.check.outputs.skip != 'true'
        run: ./prepare.sh "${{ steps.upstream.outputs.tag }}" src

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.skip != 'true'
        with:
          context: src
          file: src/docker/Dockerfile
          push: true
          build-args: COMMIT=${{ steps.upstream.outputs.tag }}-pr8536-${{ steps.upstream.outputs.pr }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.tag }}-pr${{ steps.upstream.outputs.pr }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mealie ${{ steps.upstream.outputs.tag }} with document import (PDF, Word, ODT, text) from mealie-recipes/mealie#8536
